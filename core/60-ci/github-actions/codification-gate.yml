# codification-gate.yml -- server-side codification gate (GitHub Actions).
#
# What it does: on every pull request, runs the same check the local
# pre-commit hook runs (githooks/check-codification.sh) on the files the PR
# adds or modifies, and fails the check run on any violation.
#
# How to adopt in a project:
#   1. Copy this file into the project's .github/workflows/ directory.
#   2. Make sure githooks/check-codification.sh and githooks/codification.allow
#      exist in the project root (see core/50-gates/ in the frame home).
#   3. On GitHub: Settings -> Branches -> add a branch protection rule for the
#      default branch -> enable "Require a pull request before merging" and
#      "Require status checks to pass" -> select "codification-gate" as a
#      required check (it appears in the list after the first run).

name: codification-gate

on:
  pull_request:

jobs:
  codification-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the codification check on files changed by the PR
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # Added/Copied/Modified files of this PR relative to the merge base.
          files=$(git diff --name-only --diff-filter=ACM "$base"...HEAD)
          if [ -z "$files" ]; then
            echo "No added or modified files to check."
            exit 0
          fi
          echo "Files under check:"
          echo "$files"
          # shellcheck disable=SC2086
          sh githooks/check-codification.sh $files
